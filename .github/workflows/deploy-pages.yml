name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static SPA
        run: npm run build:pages
        env:
          # Bake the Supabase URL/key into the client bundle at build time.
          # Set these in repo Settings -> Secrets and variables -> Actions.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Optional: live market feed (deploy supabase/functions/market-quotes first).
          # If unset, the site falls back to clearly-labeled simulated prices.
          VITE_MARKET_QUOTES_URL: ${{ secrets.VITE_MARKET_QUOTES_URL }}
          # Uncomment once prafund.co DNS points at GitHub Pages:
          # PAGES_CNAME: prafund.co
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
